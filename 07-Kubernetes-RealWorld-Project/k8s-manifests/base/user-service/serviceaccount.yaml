apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service
  labels:
    app: user-service
    component: backend
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: user-service
  labels:
    app: user-service
    component: backend
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: user-service
  labels:
    app: user-service
    component: backend
subjects:
- kind: ServiceAccount
  name: user-service
  namespace: default
roleRef:
  kind: Role
  name: user-service
  apiGroup: rbac.authorization.k8s.io